[package]
name    = "telegraph-scoring"
version = "0.1.0"
edition = "2021"

# ── Build target ──────────────────────────────────────────────────────────────
# cargo build --target wasm32-unknown-unknown --release
# Output: target/wasm32-unknown-unknown/release/telegraph_scoring.wasm
[lib]
# rlib is needed so native integration tests (tests/realbench.rs) can link the
# crate and measure real signal values; the WASM artifact only uses cdylib.
crate-type = ["cdylib", "rlib"]

# ── Features ──────────────────────────────────────────────────────────────────
[features]
default = []
# Activate once you have run scripts/export_minilm_weights.py
real_weights = []
# Expose internal scoring primitives for the native measurement harness
# (tests/realbench.rs). Never enabled for release WASM builds.
bench = []

# ── Dependencies ──────────────────────────────────────────────────────────────
[dependencies]
# Allocator for no_std WASM
dlmalloc = { version = "0.2", features = ["global"] }
# Pure-Rust math (exp, sqrt, tanh …) — no libc, no host calls
libm     = { version = "0.2", default-features = false }

# ── Release profile ───────────────────────────────────────────────────────────
[profile.release]
opt-level     = "z"     # minimise binary size
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true

[profile.dev]
panic         = "abort"

# Native measurement harness: runs as a plain binary (fn main), not the
# default #[test] harness, so it prints the full signal table.
[[test]]
name = "realbench"
harness = false
